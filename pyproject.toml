[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-window"
version = "0.1.0"
description = "Control a KDE Plasma desktop's mouse and keyboard from a browser, with live video"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# PyGObject (and GStreamer itself) should come from the distro: see the
# README. pip only builds PyGObject from source, which needs its headers.
dependencies = [
  "aiohttp>=3.9",
  "evdev>=1.6",
  "pillow>=10",
  "dbus-fast>=2",
  "PyGObject>=3.42",
]

[project.scripts]
desk-window = "desk_window.__main__:main"

[tool.setuptools]
packages = ["desk_window"]

[tool.setuptools.package-data]
desk_window = ["public/*"]
